name: Docs

# The documentation on every push to main and every pull request, including those that change only
# Markdown (ci.yml skips them): the generated pages are up to date, and the map, links, anchors and
# what the code cites hold (test/unit/docs.test.ts). CONTRIBUTING.md, Documentation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated pages are up to date
        run: |
          npm run docs
          if [ -n "$(git status --porcelain -- docs)" ]; then git status --short -- docs; echo "::error::Run npm run docs and commit the pages it writes."; exit 1; fi
      - run: node --test --test-global-setup=test/isolate.ts test/unit/docs.test.ts
