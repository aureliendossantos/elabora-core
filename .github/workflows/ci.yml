name: CI

# Linux and Windows on every push to main, every pull request and every release (Release core calls
# this workflow); macOS as well weekly and when CI itself is dispatched. Each system's suites run as
# parallel jobs, every one under 30 minutes: the typecheck and the unit suite, then the e2e suite and
# the matrix, each in two halves (whole, they took macOS 21 and 26 min, 2 and 6 Nov 2026). Windows
# runs the typecheck and the unit suite. macOS is not on every push: on GitHub's macOS runners eight
# tests of animation, WebGL and timing fail (6 Nov 2026, two runs: design captures, continuity,
# canal-locks' gates every time), where they pass on a Mac. The app's test:batch skips the core's
# suites when this is green on main's commit (or the last one with the same code).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when Release core calls this workflow: its run never cancels
  # main's CI, nor is cancelled by it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # github.workflow is the caller's name in a workflow_call: a dispatched release adds no macOS.
        os: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.workflow == 'CI')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        suite: [unit, e2e, matrix]
        shard: ['1/2', '2/2']
        exclude:
          # Windows: the browser suites pass on a Windows 11 machine (24 of 24 on 7 Oct 2026) but three
          # canvas tests time out on GitHub's Windows runners: they run on Linux and macOS here.
          - { os: windows-latest, suite: e2e }
          - { os: windows-latest, suite: matrix }
          # The unit suite and the typecheck whole, in one job.
          - { suite: unit, shard: '2/2' }
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ffmpeg: the GPL builds of BtbN/FFmpeg-Builds (libx264, libwebp, zimg) on Linux and
      # Windows, Homebrew on macOS. Google Chrome and Microsoft Edge are already installed on the
      # runners (test/e2e/edge.test.ts compares them). Both downloads retry: BtbN's `latest`
      # answers 404 while it rebuilds at night (3 Nov 2026).
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1 && rm ffmpeg.tar.xz
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 30 -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          Remove-Item ffmpeg.zip
          $bin = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter 'ffmpeg-*').FullName + '\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -hide_banner -version

      - run: pnpm run typecheck
        if: matrix.suite == 'unit'
      - run: pnpm run release:check
        if: matrix.suite == 'unit'
      - run: pnpm test
        if: matrix.suite == 'unit'
      # pnpm run test:e2e and test:matrix by halves (package.json's commands): --test-shard goes before
      # the files, where pnpm run cannot add it.
      - name: pnpm run test:${{ matrix.suite }} (half ${{ matrix.shard }})
        if: matrix.suite != 'unit'
        run: node --test --test-shard=${{ matrix.shard }} --test-force-exit --test-global-setup=test/isolate.ts --import ./scripts/heavy-slots.ts --test-concurrency=2 "test/${{ matrix.suite }}/*.test.ts"
