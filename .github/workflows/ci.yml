name: CI

# Linux, macOS and Windows on every push to main, every pull request and every release (Release core
# calls this workflow); also weekly and on demand. The repository is public: minutes are free. Each
# system's suites run as parallel jobs, every one under 30 minutes: the typecheck and the unit suite,
# the e2e suite in two halves (macOS's took 21 min whole, 2 Nov 2026), the matrix. Windows runs the
# typecheck and the unit suite. The app's test:batch skips the core's suites when this is green on
# main's commit (or the last one with the same code).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when Release core calls this workflow: its run never cancels
  # main's CI, nor is cancelled by it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.part }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, part: unit }
          - { os: ubuntu-latest, part: e2e 1/2 }
          - { os: ubuntu-latest, part: e2e 2/2 }
          - { os: ubuntu-latest, part: matrix }
          - { os: macos-latest, part: unit }
          - { os: macos-latest, part: e2e 1/2 }
          - { os: macos-latest, part: e2e 2/2 }
          - { os: macos-latest, part: matrix }
          - { os: windows-latest, part: unit }
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ffmpeg: the GPL builds of BtbN/FFmpeg-Builds (libx264, libwebp, zimg) on Linux and
      # Windows, Homebrew on macOS. Google Chrome and Microsoft Edge are already installed on the
      # runners (test/e2e/edge.test.ts compares them). Both downloads retry: BtbN's `latest`
      # answers 404 while it rebuilds at night (3 Nov 2026).
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1 && rm ffmpeg.tar.xz
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 30 -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          Remove-Item ffmpeg.zip
          $bin = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter 'ffmpeg-*').FullName + '\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -hide_banner -version

      - run: pnpm run typecheck
        if: matrix.part == 'unit'
      - run: pnpm run release:check
        if: matrix.part == 'unit'
      - run: pnpm test
        if: matrix.part == 'unit'
      # Windows: the browser suites pass on a Windows 11 machine (24 of 24 on 7 Oct 2026) but three
      # canvas tests time out on GitHub's Windows runners: they run on Linux and macOS here.
      # pnpm run test:e2e, by halves: --test-shard goes before the files, where pnpm cannot add it.
      - name: pnpm run test:e2e (${{ matrix.part }})
        if: startsWith(matrix.part, 'e2e')
        run: node --test --test-shard=${{ matrix.part == 'e2e 1/2' && '1/2' || '2/2' }} --test-force-exit --test-global-setup=test/isolate.ts --import ./scripts/heavy-slots.ts --test-concurrency=2 "test/e2e/*.test.ts"
      - run: pnpm run test:matrix
        if: matrix.part == 'matrix'
