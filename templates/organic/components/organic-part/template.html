<!-- The opening's template in its title presentation, without a picture (propsOmit), the part's
     number above the title. Reading order: the number, read « Part 1 » (the player's label part, in the
     course's language), the title, the lead and the reading time, then the question before the
     lesson and the page. -->
<div class="t-opening t-opening--title">
  <header class="t-opening-head">
    <div class="t-opening-copy">
      <p class="organic-part-number" data-if="number"><span class="t-sr-only" data-t-label="part"></span> <span>{{number}}</span></p>
      <div class="t-opening-title" data-title></div>
      <div class="t-opening-lead t-text" data-if="lead">{{lead}}</div>
      <p class="t-opening-meta" data-if="duration"><svg class="t-opening-clock" aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.5 1.5"/></svg><span data-t-duration></span></p>
    </div>
  </header>
  <div class="t-opening-question" data-slot="question"></div>
  <div class="t-opening-body" data-slot="body"></div>
</div>
