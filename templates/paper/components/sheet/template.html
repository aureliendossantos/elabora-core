<div class="pp-sheet" data-arrangement="{{arrangement}}" data-tilt="{{tilt}}" style="--pp-sheet-paper: {{paper}}">
  <div class="pp-sheet-paper">
    <div class="pp-sheet-title" data-title></div>
    <div class="pp-sheet-lead" data-slot="lead"></div>
    <div class="pp-sheet-body" data-slot="body"></div>
  </div>
  <div class="pp-sheet-side" data-slot="side"></div>
</div>
