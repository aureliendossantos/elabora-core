<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="240" fill="#FFFFFF"/>
