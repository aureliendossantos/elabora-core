    <line x1="130" y1="110" x2="230" y2="110"/><line x1="310" y1="110" x2="410" y2="110"/>
    <line x1="490" y1="110" x2="590" y2="110"/><line x1="670" y1="110" x2="770" y2="110"/>
  </g>
