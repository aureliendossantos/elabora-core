<!-- Reading order: title, lead, side column, cards. The planet, its glow and the sunrise are decoration. -->
<section class="or-hero">
  <div class="or-hero-grid">
    <div class="or-hero-copy">
      <div class="or-hero-title" data-title></div>
      <div data-slot="lead"></div>
    </div>
    <div class="or-hero-side" data-slot="side"></div>
  </div>
  <div class="or-hero-cards" data-slot="cards"></div>
  <div class="or-hero-planet" aria-hidden="true">
    <div class="or-hero-limb"></div>
    <div class="or-hero-sunrise"></div>
  </div>
</section>
