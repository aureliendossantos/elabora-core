<!-- Reading order: label, figure, sentence. The glow is decoration. -->
<div class="or-stat" style="--stat-accent: {{accent}}">
  <p class="or-stat-label"><span class="or-stat-marker" data-if="marker">{{marker}}</span>{{label}}</p>
  <p class="or-stat-value">{{value}}<span class="or-stat-unit" data-if="unit">{{unit}}</span></p>
  <div class="or-stat-body t-text" data-if="body">{{body}}</div>
</div>
