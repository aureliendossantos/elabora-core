<!-- Native disclosures the player counts as visited once opened (data-t-details on <details>). -->
<div class="pr-details">
  <details class="pr-detail" data-each="items" data-t-details="{{id}}">
    <summary class="pr-detail-summary">{{title}}</summary>
    <div class="pr-detail-body t-text">{{markdown}}</div>
  </details>
</div>
