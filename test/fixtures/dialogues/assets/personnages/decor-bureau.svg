  <path class="sheet" d="M66 550L150 536L156 566L72 580Z"/>
  <rect class="prop-a" x="58" y="602" width="112" height="12" rx="6"/>
  <circle data-part="voyant" class="alert" cx="172" cy="626" r="7"/>
 </g>
</g>

<g data-part="lieu-droite">
