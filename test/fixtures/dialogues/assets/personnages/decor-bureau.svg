<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" data-decor="appel-support">
<style>
/* Deux demi-décors pour un appel : à gauche le bureau de Marc (chaud), à droite le support (frais).
   Contrastes bas : tout reste entre 82 et 98 de clarté L*, sauf les voyants, pour que les bulles passent devant. */
.paper{fill:var(--decor-paper,#FBF9F4)}
.wall-a{fill:var(--decor-wall-a,#F2EADF)}
.floor-a{fill:var(--decor-floor-a,#EAE0D1)}
.prop-a{fill:var(--decor-prop-a,#E3D8C8)}
.prop-a2{fill:var(--decor-prop-a2,#D8CCBA)}
.glass{fill:var(--decor-glass,#E6ECEE)}
.far{fill:var(--decor-far,#DCE4E7)}
.sheet{fill:var(--decor-sheet,#F8F3EA)}
.wall-b{fill:var(--decor-wall-b,#E8EDF0)}
.floor-b{fill:var(--decor-floor-b,#DDE4E9)}
.prop-b{fill:var(--decor-prop-b,#D6DEE4)}
.prop-b2{fill:var(--decor-prop-b2,#C9D3DB)}
.screen{fill:var(--decor-screen,#F3F6F8)}
.alert{fill:var(--decor-alert,#E58A6C)}
.ok{fill:var(--decor-ok,#8FC4A4)}
.frame-a{fill:none;stroke:var(--decor-prop-a,#E3D8C8);stroke-width:10;stroke-linecap:round}
.chart{fill:none;stroke:var(--decor-prop-b2,#C9D3DB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect class="paper" width="1600" height="900"/>

