  <rect class="glass" x="60" y="72" width="188" height="188" rx="10"/>
  <path class="far" d="M60 260V212H86V192H114V226H140V178H172V214H194V200H222V222H248V260Z"/>
  <path class="frame-a" d="M154 72V260M60 166H248"/>
 </g>
 <g data-part="imprimante">
