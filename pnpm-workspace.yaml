packages:
  - packages/*

# node_modules laid out as npm does: one flat folder at the root, its files linked from pnpm's store.
nodeLinker: hoisted

overrides:
  adm-zip: ^0.6.1
  global-agent: ^4.1.3
  # The MCP SDK's peer range lets an older zod in; 4.6.6 bounds the memory of oversized collections.
  zod: ^4.6.7

allowBuilds:
  esbuild@0.28.2: true
  onnxruntime-node: false
