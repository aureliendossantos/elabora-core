<!-- Reading order: eyebrow, title, opening, the figure beside them, then the page. The rose, its rays and the scroll cue are decoration. -->
<div class="mc-folio mc-folio--{{ornament}}">
  <header class="mc-folio-band">
    <div class="mc-folio-rose" aria-hidden="true"></div>
    <div class="mc-folio-copy">
      <p class="mc-folio-eyebrow">{{eyebrow}}</p>
      <div class="mc-folio-title" data-title></div>
      <div class="mc-folio-lead" data-slot="lead"></div>
    </div>
    <div class="mc-folio-figure" data-slot="figure"></div>
    <div class="mc-folio-cue" aria-hidden="true"></div>
  </header>
  <div class="mc-folio-body" data-slot="body"></div>
</div>
