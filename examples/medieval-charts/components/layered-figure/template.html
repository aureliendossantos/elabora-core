<!-- « Étapes » as one figure assembling itself as it scrolls into view: figureImage, then each step's
     image as a layer, then the labels. The figure's alt (figureAlt, or the one layer's) describes it
     whole; the steps' titles and texts name the layers for text views and exports. -->
<figure class="mc-layers mc-layers--{{size}} mc-layers--still-{{still}}">
  <div class="mc-layers-stage" style="--ratio: {{ratio}}">
    <img data-if="figureImage" class="mc-layers-base mc-reveal--{{baseReveal}}" src="{{figureImage}}" alt="{{figureAlt}}" decoding="async">
    <img data-each="items" data-if="image" class="mc-layers-layer mc-reveal--{{reveal}}" src="{{image}}" alt="{{alt}}" decoding="async" style="--layer: {{@number}}">
    <span data-each="labels" class="mc-layers-label mc-layers-label--{{tone}}" style="--x: {{x}}; --y: {{y}}; --angle: {{angle}}; --label: {{@number}}">{{text}}</span>
  </div>
  <figcaption class="mc-layers-caption" data-if="caption">{{caption | inline}}</figcaption>
</figure>
