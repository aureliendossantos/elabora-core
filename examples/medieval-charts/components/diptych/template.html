<div class="mc-diptych">
  <article data-each="leaves" class="mc-leaf">
    <img class="mc-leaf-image" src="{{image}}" alt="{{imageAlt}}">
    <p class="mc-leaf-eyebrow">{{eyebrow}}</p>
    <h3 class="mc-leaf-title" data-t-heading>{{title}}</h3>
    <div class="mc-leaf-body t-text">{{body}}</div>
  </article>
</div>
