<!-- Reading order: the figure and its markers (tabs), then the note of the marker selected. -->
<div class="mc-notes" data-t-tabs>
  <figure class="mc-notes-figure">
    <div class="mc-notes-stage" style="--ratio: {{ratio}}">
      <img class="mc-notes-image" src="{{image}}" alt="{{alt}}">
      <div class="mc-notes-markers">
        <button data-each="notes" type="button" class="mc-notes-marker" data-t-tab="{{id}}" style="--x: {{x}}; --y: {{y}}">{{marker}}</button>
      </div>
    </div>
    <figcaption class="mc-notes-caption" data-if="caption">{{caption | inline}}</figcaption>
  </figure>
  <div class="mc-notes-panels">
    <section data-each="notes" class="mc-notes-panel" data-t-panel="{{id}}">
      <h3 class="mc-notes-title" data-t-heading>{{title}}</h3>
      <div class="mc-notes-body t-text">{{body}}</div>
    </section>
  </div>
</div>
