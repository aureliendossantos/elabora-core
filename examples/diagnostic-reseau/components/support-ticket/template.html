<div class="tk">
  <div class="tk-head">
    <p class="tk-ref">{{reference}}</p>
    <p class="tk-priority">{{priority}}</p>
  </div>
  <p class="tk-subject">{{subject}}</p>
  <div class="tk-who">
    <img class="tk-photo" data-if="photo" src="{{photo}}" alt="">
    <div class="tk-meta">
      <p class="tk-requester">{{requester}}</p>
      <p class="tk-timing">{{timing}}</p>
    </div>
  </div>
</div>
