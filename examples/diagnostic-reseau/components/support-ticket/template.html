<div class="support-ticket">
  <div class="support-ticket__card">
    <div class="support-ticket__header">
      <p class="support-ticket__reference">{{reference}}</p>
      <p class="support-ticket__priority">{{priority}}</p>
    </div>
    <div class="support-ticket__body">
      <h2 class="support-ticket__subject">{{subject}}</h2>
      <div class="support-ticket__details">
        <div class="support-ticket__metadata">
          <p>{{requester}}</p>
          <p>{{timing}}</p>
        </div>
        <span class="support-ticket__avatar" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</div>
