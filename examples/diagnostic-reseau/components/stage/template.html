<!-- Reading order: title, text, scene, note. -->
<div class="st-stage st-stage--{{arrangement}}">
  <div class="st-text">
    <div class="st-title" data-title></div>
    <div class="st-body" data-slot="body"></div>
  </div>
  <div class="st-scene" data-slot="scene"></div>
  <div class="st-note" data-slot="note"></div>
</div>
