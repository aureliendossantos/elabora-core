<!-- Reading order: title, then the text. The planet, its orbit with two craft and the sunrise are decoration. -->
<section class="or-hero">
  <div class="or-hero-copy">
    <div class="or-hero-title" data-title></div>
    <div class="or-hero-text" data-slot="lead"></div>
  </div>
  <div class="or-hero-planet" aria-hidden="true">
    <div class="or-hero-limb"></div>
    <div class="or-hero-sunrise"></div>
    <div class="or-hero-orbit">
      <div class="or-hero-pair">
        <span class="or-hero-craft or-hero-craft--you"></span>
        <span class="or-hero-craft or-hero-craft--ahead"></span>
      </div>
    </div>
  </div>
</section>
