<!-- Reading order: the marker, the figure, what it measures (under it). -->
<div class="or-line" style="--line-accent: {{accent}}">
  <span class="or-line-marker" data-if="marker">{{marker}}</span>
  <p class="or-line-value">{{value}}<span class="or-line-unit" data-if="unit">{{unit}}</span></p>
  <p class="or-line-label">{{label}}</p>
</div>
