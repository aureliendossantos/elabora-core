<!-- An overlay the size of the figure; only the marker takes clicks. -->
<div class="or-hot" style="--x: {{x}}; --y: {{y}}; --hot-accent: {{accent}}">
  <button class="or-hot-button" data-t-click aria-label="{{label}}"><span class="or-hot-marker" aria-hidden="true">{{marker}}</span></button>
</div>
