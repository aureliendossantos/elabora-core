    <path class="ink-line" d="M154 237Q164 246 174 237M226 237Q236 246 246 237"/>
   </g>

   <g data-part="eyes-closed">
    <ellipse class="skin" cx="164" cy="236" rx="13" ry="14"/>
    <ellipse class="skin" cx="236" cy="236" rx="13" ry="14"/>
    <path class="ink-line" d="M153 239Q164 245 175 239M225 239Q236 245 247 239"/>
   </g>

   <path data-mouth="closed" class="ink-line" d="M185 292Q200 299 215 292"/>
   <ellipse data-mouth="small" class="mouth" cx="200" cy="294" rx="10" ry="6"/>
   <g data-mouth="open">
    <ellipse class="mouth" cx="200" cy="295" rx="14" ry="11"/>
    <ellipse class="tongue" cx="200" cy="301" rx="8" ry="4.5"/>
   </g>
   <g data-mouth="wide">
    <ellipse class="mouth" cx="200" cy="297" rx="17" ry="16"/>
    <ellipse class="tongue" cx="200" cy="306" rx="10" ry="6"/>
    <rect class="teeth" x="190" y="283" width="20" height="5" rx="2.5"/>
   </g>
   <g data-mouth="closed" data-expression="smiling">
    <path class="mouth" d="M178 286Q200 291 222 286Q218 309 200 309Q182 309 178 286Z"/>
    <path class="teeth" d="M183 288Q200 292 217 288L216 294Q200 297 184 294Z"/>
   </g>
   <path data-mouth="small" data-expression="smiling" class="mouth" d="M184 288Q200 292 216 288Q213 303 200 303Q187 303 184 288Z"/>
   <g data-mouth="open" data-expression="smiling">
    <path class="mouth" d="M180 286Q200 291 220 286Q217 311 200 311Q183 311 180 286Z"/>
    <path class="teeth" d="M184 288Q200 292 216 288L215 293Q200 296 185 293Z"/>
   </g>
   <g data-mouth="wide" data-expression="smiling">
    <path class="mouth" d="M178 284Q200 290 222 284Q219 317 200 317Q181 317 178 284Z"/>
    <path class="teeth" d="M182 286Q200 291 218 286L217 292Q200 296 183 292Z"/>
    <ellipse class="tongue" cx="200" cy="310" rx="10" ry="5"/>
   </g>
   <path data-mouth="closed" data-expression="pressing" class="ink-line" d="M186 296Q200 291 214 296"/>
   <path data-mouth="closed" data-expression="annoyed" class="ink-line" d="M186 297L214 292"/>
   <path data-mouth="closed" data-expression="relieved" class="ink-line" d="M184 290Q200 303 216 290"/>
  </g>
  <g data-part="arm-phone">
   <path class="sleeve" d="M76 640Q70 470 104 352"/>
   <rect class="gear" x="112" y="190" width="30" height="96" rx="9" transform="rotate(-10 127 238)"/>
   <rect class="screen" x="117" y="198" width="20" height="78" rx="5" transform="rotate(-10 127 238)"/>
   <rect class="skin" x="84" y="232" width="52" height="82" rx="26" transform="rotate(-10 110 273)"/>
   <ellipse class="skin" cx="140" cy="262" rx="10" ry="18" transform="rotate(24 140 262)"/>
   <rect class="top" x="80" y="306" width="52" height="18" rx="9" transform="rotate(-8 106 315)"/>
  </g>
  <g data-part="arm-watch" data-gesture="watch">
   <path class="sleeve" style="stroke:var(--character-top-deep,#3E4E64)" d="M332 640Q340 520 304 478"/>
   <g data-part="forearm-watch">
    <path class="forearm" d="M300 478L206 442"/>
    <rect class="accent" x="214" y="420" width="16" height="48" rx="6" transform="rotate(21 222 444)"/>
