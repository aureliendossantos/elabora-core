<!-- Panels (« Panneaux », D63): one list of items, four presentations. Every item is a control named by
     its id whatever the presentation (a panel opened, a tab shown, a card turned, a card seen), so its
     visited state follows a change of presentation. -->
<div class="t-panels t-panels--accordion" data-if="presentation == accordion">
  <p class="t-panels-prompt" data-if="prompt">{{prompt}}</p>
  <div class="t-accordion">
    <details class="t-panels-panel" data-each="items" data-if="allowMultiple" data-t-details="{{id}}">
      <summary class="t-panels-summary">{{title}}</summary>
      <div class="t-panels-content">
        <img class="t-panels-image" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async">
        <div class="t-text">{{markdown}}</div>
      </div>
    </details>
    <details class="t-panels-panel" data-each="items" data-if="!allowMultiple" name="t-acc-{{@id}}" data-t-details="{{id}}">
      <summary class="t-panels-summary">{{title}}</summary>
      <div class="t-panels-content">
        <img class="t-panels-image" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async">
        <div class="t-text">{{markdown}}</div>
      </div>
    </details>
  </div>
</div>
<!-- Tabs: the panels share one cell, so the block keeps the room of the tallest. In containers narrower
     than 560 px the same items show as an accordion (player.css switches them; only one is rendered). -->
<div class="t-panels t-panels--tabs" data-if="presentation == tabs">
  <p class="t-panels-prompt" data-if="prompt">{{prompt}}</p>
  <div class="t-panels-tabs" data-t-tabs>
    <div class="t-panels-tablist">
      <button class="t-panels-tab" data-each="items" data-t-tab="{{id}}">{{title}}</button>
    </div>
    <div class="t-panels-tabpanels">
      <div class="t-panels-tabpanel" data-each="items" data-t-panel="{{id}}">
        <img class="t-panels-image" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async">
        <div class="t-text">{{markdown}}</div>
      </div>
    </div>
  </div>
  <div class="t-panels-narrow t-accordion">
    <details class="t-panels-panel" data-each="items" name="t-tabs-{{@id}}" data-t-details="{{id}}">
      <summary class="t-panels-summary">{{title}}</summary>
      <div class="t-panels-content">
        <img class="t-panels-image" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async">
        <div class="t-text">{{markdown}}</div>
      </div>
    </details>
  </div>
</div>
<!-- Cards: flip cards in a grid whose rows share the height of the tallest card. The button covers its
     face (a press anywhere turns the card) and the player words it; hint shows its words. -->
<div class="t-panels t-panels--cards" data-if="presentation == cards" data-hint="{{hint}}">
  <p class="t-panels-prompt" data-if="prompt">{{prompt}}</p>
  <ul class="t-panels-cards" role="list">
    <li class="t-panels-cell" data-each="items">
      <div class="t-panels-card" data-t-card="{{id}}">
        <div class="t-panels-face t-panels-front" data-t-face="front">
          <img class="t-panels-cover" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async" style="--focus-x: {{focus.x}}; --focus-y: {{focus.y}}">
          <h3 class="t-panels-title" data-t-heading>{{title}}</h3>
          <button class="t-panels-flip" data-t-flip="{{id}}"></button>
        </div>
        <div class="t-panels-face t-panels-back" data-t-face="back">
          <div class="t-text">{{markdown}}</div>
          <button class="t-panels-flip" data-t-flip="{{id}}"></button>
        </div>
      </div>
    </li>
  </ul>
</div>
<!-- Stack: the flip cards one at a time (a sequence: Previous, Next, where the learner is). -->
<div class="t-panels t-panels--stack" data-if="presentation == stack" data-hint="{{hint}}">
  <p class="t-panels-prompt" data-if="prompt">{{prompt}}</p>
  <div class="t-panels-stack" data-t-sequence>
    <div class="t-panels-stack-items">
      <div class="t-panels-stack-item" data-each="items" data-t-item="{{id}}">
        <div class="t-panels-card" data-t-card="{{id}}">
          <div class="t-panels-face t-panels-front" data-t-face="front">
            <img class="t-panels-cover" data-if="image" src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async" style="--focus-x: {{focus.x}}; --focus-y: {{focus.y}}">
            <h3 class="t-panels-title" data-t-heading>{{title}}</h3>
            <button class="t-panels-flip" data-t-flip="{{id}}"></button>
          </div>
          <div class="t-panels-face t-panels-back" data-t-face="back">
            <div class="t-text">{{markdown}}</div>
            <button class="t-panels-flip" data-t-flip="{{id}}"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="t-panels-nav">
      <button class="t-panels-arrow" data-t-prev><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <span class="t-panels-position" data-t-position></span>
      <button class="t-panels-arrow" data-t-next><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
