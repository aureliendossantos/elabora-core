<!-- Reading order: the title, the lead and the reading time, then the picture, the question before
     the lesson and the page; no line above the title (D63 amended). The scrim and the cue are decoration. -->
<div class="t-opening t-opening--{{presentation}}">
  <header class="t-opening-head" style="--focus-x: {{focus.x}}; --focus-y: {{focus.y}}">
    <div class="t-opening-copy">
      <div class="t-opening-title" data-title></div>
      <div class="t-opening-lead t-text" data-if="lead">{{lead}}</div>
      <p class="t-opening-meta" data-if="duration"><svg class="t-opening-clock" aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.5 1.5"/></svg><span data-t-duration></span></p>
    </div>
    <div class="t-opening-media" data-if="image">
      <img data-if="decorative" src="{{image}}" alt="" decoding="async" fetchpriority="high">
      <img data-if="!decorative" src="{{image}}" alt="{{alt}}" decoding="async" fetchpriority="high">
      <p class="t-genmark" data-if="generated" data-t-label="generated"></p>
    </div>
  </header>
  <div class="t-opening-question" data-slot="question"></div>
  <div class="t-opening-body" data-slot="body"></div>
</div>
