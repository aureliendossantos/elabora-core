<div class="t-quiz t-reflection t-reflection--{{presentation}}" data-t-group>
  <div class="t-quiz-stem t-text" data-t-prompt>{{prompt}}</div>
  <div class="t-reflection-response" data-t-response></div>
  <button type="button" class="t-btn t-btn--primary t-quiz-submit" data-t-submit></button>
  <div class="t-feedback" data-t-feedback></div>
  <div class="t-reflection-model" data-if="model" data-t-model></div>
  <button type="button" class="t-btn t-btn--secondary t-reflection-download" data-if="download" data-t-download></button>
</div>
