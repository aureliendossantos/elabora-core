<div class="t-quiz t-numeric" data-t-group>
  <div class="t-quiz-stem t-text" data-t-stem>{{stem}}</div>
  <div class="t-numeric-row">
    <label class="t-numeric-label" data-t-input-label></label>
    <span class="t-numeric-field">
      <input class="t-numeric-input" data-t-input>
      <span class="t-numeric-unit" data-if="unit" data-t-unit>{{unit}}</span>
    </span>
    <button type="button" class="t-btn t-btn--primary t-quiz-submit" data-t-submit></button>
  </div>
  <div class="t-feedback" data-t-feedback></div>
</div>
