<div class="t-quiz t-fillin t-fillin--{{presentation}}" data-t-group>
  <div class="t-quiz-stem t-text" data-if="stem" data-t-stem>{{stem}}</div>
  <div class="t-fillin-text t-text" data-t-text>{{markdown}}</div>
  <div class="t-bank" data-if="presentation == bank" data-t-bank></div>
  <button type="button" class="t-btn t-btn--primary t-quiz-submit" data-t-submit></button>
  <div class="t-feedback" data-t-feedback></div>
</div>
