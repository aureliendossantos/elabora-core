<figure class="t-figure">
  <img data-if="decorative" src="{{asset}}" alt="" loading="lazy" decoding="async">
  <img data-if="!decorative" src="{{asset}}" alt="{{alt}}" loading="lazy" decoding="async">
  <figcaption data-if="caption">{{caption}}</figcaption>
  <p class="t-genmark" data-if="generated" data-t-label="generated"></p>
</figure>
