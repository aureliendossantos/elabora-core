<!-- A steps block (« Étapes », D63). Not the screen's steps: one block whose items the learner goes through.
     carousel: one step at a time (data-t-sequence), the intro and the summary its first and last items.
     timeline: the steps one under the other, each visited once in view (data-t-reveal).
     scroll: the steps scroll beside a figure the player follows (data-t-follow: the step crossing the middle of
     the window is current); each step also carries its own picture, shown in narrow places, in slides, with
     less motion and without the player, and read by screen readers (the following figure is aria-hidden). -->
<div class="t-steps t-steps--carousel" data-if="presentation == carousel" data-t-sequence>
  <div class="t-steps-items">
    <section class="t-steps-item t-steps-item--intro" data-if="intro" data-t-item="intro">
      <figure class="t-steps-picture" data-if="intro.image"><img src="{{intro.image}}" alt="{{intro.alt}}" decoding="async"></figure>
      <div class="t-steps-words">
        <h3 class="t-steps-title" data-t-heading>{{intro.title}}</h3>
        <div class="t-steps-body t-text" data-if="intro.markdown">{{intro.markdown}}</div>
        <button class="t-btn t-btn--primary t-steps-start" data-t-next data-t-label="beginSteps"></button>
      </div>
    </section>
    <section class="t-steps-item" data-each="items" data-t-item="{{id}}">
      <figure class="t-steps-picture" data-if="image"><img src="{{image}}" alt="{{alt}}" decoding="async"></figure>
      <div class="t-steps-words">
        <p class="t-steps-number" data-if="numbered" aria-hidden="true">{{@number}}</p>
        <h3 class="t-steps-title" data-t-heading>{{title}}</h3>
        <div class="t-steps-body t-text">{{markdown}}</div>
      </div>
    </section>
    <section class="t-steps-item t-steps-item--summary" data-if="summary" data-t-item="summary">
      <figure class="t-steps-picture" data-if="summary.image"><img src="{{summary.image}}" alt="{{summary.alt}}" decoding="async"></figure>
      <div class="t-steps-words">
        <h3 class="t-steps-title" data-t-heading>{{summary.title}}</h3>
        <div class="t-steps-body t-text" data-if="summary.markdown">{{summary.markdown}}</div>
      </div>
    </section>
  </div>
  <div class="t-steps-nav">
    <button class="t-steps-arrow" data-t-prev><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <ol class="t-steps-dots">
      <li data-if="intro"><button class="t-steps-dot t-steps-dot--end" data-t-goto="intro" aria-label="{{intro.title}}"></button></li>
      <li data-each="items"><button class="t-steps-dot" data-t-goto="{{id}}" aria-label="{{title}}"></button></li>
      <li data-if="summary"><button class="t-steps-dot t-steps-dot--end" data-t-goto="summary" aria-label="{{summary.title}}"></button></li>
    </ol>
    <span class="t-steps-position" data-t-position></span>
    <button class="t-steps-arrow" data-t-next><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  </div>
</div>
<ol class="t-steps t-steps--timeline" data-if="presentation == timeline">
  <li class="t-steps-event" data-each="items" data-t-reveal="{{id}}">
    <p class="t-steps-date" data-if="date">{{date}}</p>
    <div class="t-steps-words">
      <h3 class="t-steps-title" data-t-heading>{{title}}</h3>
      <figure class="t-steps-picture" data-if="image"><img src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async"></figure>
      <div class="t-steps-body t-text">{{markdown}}</div>
    </div>
  </li>
</ol>
<div class="t-steps t-steps--scroll t-steps--{{figure}} t-steps--side-{{side}}" data-if="presentation == scroll" data-t-follow>
  <div class="t-steps-stage" aria-hidden="true">
    <div class="t-steps-frame">
      <img class="t-steps-base" data-if="figureImage" src="{{figureImage}}" alt="" decoding="async">
      <div class="t-steps-layers" data-if="figure != focus">
        <img class="t-steps-layer" data-each="items" data-if="image" src="{{image}}" alt="" decoding="async" style="--layer: {{@number}}">
      </div>
      <div class="t-steps-regions" data-if="figure == focus">
        <span class="t-steps-region" data-each="items" data-if="region" style="--layer: {{@number}}; --rx: {{region.x}}; --ry: {{region.y}}; --rw: {{region.w}}; --rh: {{region.h}}"></span>
      </div>
    </div>
  </div>
  <ol class="t-steps-list">
    <li class="t-steps-step" data-each="items" data-t-reveal="{{id}}" style="--step: {{@number}}">
      <div class="t-steps-own" data-if="figure == replace">
        <figure class="t-steps-picture" data-if="image"><img src="{{image}}" alt="{{alt}}" loading="lazy" decoding="async"></figure>
      </div>
      <div class="t-steps-own" data-if="figure == build">
        <div class="t-steps-picture t-steps-stack" data-if="alt" role="img" aria-label="{{alt}}">
          <img class="t-steps-base" data-if="figureImage" src="{{figureImage}}" alt="" loading="lazy" decoding="async">
          <img class="t-steps-layer" data-each="items" data-if="image" src="{{image}}" alt="" loading="lazy" decoding="async" style="--layer: {{@number}}">
        </div>
        <div class="t-steps-picture t-steps-stack" data-if="!alt" aria-hidden="true">
          <img class="t-steps-base" data-if="figureImage" src="{{figureImage}}" alt="" loading="lazy" decoding="async">
          <img class="t-steps-layer" data-each="items" data-if="image" src="{{image}}" alt="" loading="lazy" decoding="async" style="--layer: {{@number}}">
        </div>
      </div>
      <div class="t-steps-own" data-if="figure == focus">
        <figure class="t-steps-picture t-steps-spot" data-if="figureImage" style="--rx: {{region.x}}; --ry: {{region.y}}; --rw: {{region.w}}; --rh: {{region.h}}">
          <img src="{{figureImage}}" alt="{{figureAlt}}" loading="lazy" decoding="async">
          <span class="t-steps-region" data-if="region"></span>
        </figure>
      </div>
      <div class="t-steps-words">
        <p class="t-steps-number" data-if="numbered" aria-hidden="true">{{@number}}</p>
        <h3 class="t-steps-title" data-t-heading>{{title}}</h3>
        <div class="t-steps-body t-text">{{markdown}}</div>
      </div>
    </li>
  </ol>
</div>
