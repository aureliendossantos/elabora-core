<div class="t-decision" data-t-group>
  <div class="t-decision-prompt t-text" data-t-prompt>{{prompt}}</div>
  <div class="t-choices">
    <button type="button" class="t-choice" data-each="options" data-t-choice="{{id}}">{{label}}</button>
  </div>
  <div class="t-feedback" data-t-feedback></div>
</div>
